name: RDP (Fixed Complex Password)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" || Write-Host "No existing rule"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create/Update RDP User with Complex Fixed Password
        run: |
          # Use a password that satisfies Windows complexity policy
          $fixedPassword = "Gurjar@2025!"
          $securePass = ConvertTo-SecureString $fixedPassword -AsPlainText -Force

          try {
              if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
                  Write-Host "User 'RDP' exists – updating password."
                  Set-LocalUser -Name 'RDP' -Password $securePass -ErrorAction Stop
              } else {
                  Write-Host "Creating new RDP user."
                  New-LocalUser -Name 'RDP' -Password $securePass -FullName 'RDP User' -Description 'Fixed Complex Password Account' -AccountNeverExpires -ErrorAction Stop
                  Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue
                  Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
              }

              Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=User: RDP | Password: $fixedPassword"
              $env:RDP_CREDS = "User: RDP | Password: $fixedPassword"
              Write-Host "✅ RDP user ready. Username: RDP, Password: $fixedPassword"
          } catch {
              Write-Error "Failed creating/updating 'RDP' user: $($_.Exception.Message)"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path -Path $env:TEMP -ChildPath "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tailscaleExe = Join-Path -Path $env:ProgramFiles -ChildPath 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tailscaleExe)) { Write-Error "Tailscale not found"; exit 1 }
          $authKey = "tskey-auth-kfwPw32Zkb11CNTRL-UcY3V2VN9vC6ovzxjTdnuCN8DMP2vs5K"
          $hostname = "gh-runner-$($env:GITHUB_RUN_ID)"
          & $tailscaleExe up --authkey="$authKey" --hostname="$hostname" --accept-routes --accept-dns=true

          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $raw = & $tailscaleExe ip -4 2>$null
              if ($raw) { $candidate = ($raw -split '\s+')[0]; if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') { $tsIP = $candidate; break } }
              Start-Sleep -Seconds 5; $retries++
          }
          if (-not $tsIP) { Write-Error "No Tailscale IP"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          $env:TAILSCALE_IP = $tsIP
          Write-Host "✅ Tailscale IP: $tsIP"

      - name: Verify RDP Port
        run: |
          if (-not $env:TAILSCALE_IP) { Write-Error "TAILSCALE_IP not set"; exit 1 }
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) { Write-Error "RDP port not reachable"; exit 1 }
          Write-Host "✅ RDP port reachable"

      - name: Maintain Connection (masked creds + timed)
        run: |
          if ($env:RDP_CREDS) { Write-Host "::add-mask::${env:RDP_CREDS}" }
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $($env:TAILSCALE_IP)"
          Write-Host "Username: RDP"
          Write-Host "Password: Gurjar@2025!"
          Write-Host "==================`n"
          $end = (Get-Date).AddMinutes(360)
          while ((Get-Date) -lt $end) { Write-Host "Alive: $(Get-Date -Format o)"; Start-Sleep -Seconds 300 }
          Write-Host "Done"
