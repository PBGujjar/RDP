name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          # Disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 0 -Force

          # Firewall rule for RDP (remove existing then add)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" || Write-Host "No existing rule"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create/Update RDP User with Fixed Password
        run: |
          $fixedPassword = "Gurjar"  # <-- Fixed password
          $securePass = ConvertTo-SecureString $fixedPassword -AsPlainText -Force

          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
              Write-Host "User 'RDP' exists – updating password."
              Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
              Write-Host "Creating new RDP user."
              New-LocalUser -Name 'RDP' -Password $securePass -FullName 'RDP User' -Description 'Fixed Password Account' -AccountNeverExpires
              Add-LocalGroupMember -Group 'Administrators' -Member 'RDP'
              Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'
          }

          # Export credentials for later steps (and session)
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=User: RDP | Password: $fixedPassword"
          $env:RDP_CREDS = "User: RDP | Password: $fixedPassword"

          Write-Host "✅ RDP user ready. Username: RDP, Password: Gurjar"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path -Path $env:TEMP -ChildPath "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscaleExe = Join-Path -Path $env:ProgramFiles -ChildPath 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          $hostname = "gh-runner-$($env:GITHUB_RUN_ID)"
          & $tailscaleExe up --authkey="${env:TAILSCALE_AUTH_KEY}" --hostname="$hostname"

          # Wait for Tailscale IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $raw = & $tailscaleExe ip -4 2>$null
              if ($raw) {
                  $candidate = ($raw -split '\s+')[0]
                  if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                      $tsIP = $candidate
                      break
                  }
              }
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "No Tailscale IP assigned."
              exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          $env:TAILSCALE_IP = $tsIP
          Write-Host "✅ Tailscale connected. IP: $tsIP"

      - name: Verify RDP Port
        run: |
          Write-Host "Testing RDP at $env:TAILSCALE_IP:3389"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to port 3389 failed"
              exit 1
          }
          Write-Host "✅ RDP Port 3389 reachable!"

      - name: Maintain Connection (timed keep-alive)
        env:
          RDP_CREDS: ${{ env.RDP_CREDS }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          KEEP_ALIVE_MINUTES: 360   # change if needed
        run: |
          # Mask the creds string in runner logs
          Write-Host "::add-mask::${env:RDP_CREDS}"

          # Print connection details (credentials masked)
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $($env:TAILSCALE_IP)"
          Write-Host "Username: RDP"
          Write-Host "Password: Gurjar"
          Write-Host "==================`n"

          # Keep runner active for configured minutes (no infinite loop)
          $minutes = [int]$env:KEEP_ALIVE_MINUTES
          $endTime = (Get-Date).AddMinutes($minutes)
          while ((Get-Date) -lt $endTime) {
              Write-Host "[$(Get-Date -Format o)] RDP Active - will stop at $($endTime.ToString('o'))"
              Start-Sleep -Seconds 300
          }

          Write-Host "⏹ RDP session timeout reached."
